#
# Hand-curated behavioral overrides for models that need Goa-specific
# metadata not available from models.dev (thinking format, level maps,
# compat quirks). Applied on top of the embedded api.json catalog.
#
# Priority: YAML override > embedded api.json > runtime catalog.
# Keyed by (provider, model_id). Prefix IDs (ending with -) match any
# model ID starting with the prefix (e.g. "deepseek-" matches all).

