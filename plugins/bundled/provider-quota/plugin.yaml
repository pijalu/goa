id: provider-quota
name: Provider Quota
version: 1.2.2
description: Universal usage/quota tracker for all configured providers. Adds a /quota command with a full breakdown, Codex rate-limit reset details/consume, and a compact quota segment in the status bar.
entry: plugin.js
goa_min_version: 0.1.0
permissions:
  - provider-keys
  - oauth-token
  - account-write
  - ui-confirm
