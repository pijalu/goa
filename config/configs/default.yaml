# Goa default configuration
# This is the embedded default — user configs in ~/.goa/config.yaml,
# .goa/config.yaml, and .goa/config.local.yaml override these values.

active_provider: ""
active_model: ""

mode:
  default:
    major: "coder"
    skills: []
  defaults: {}

execution:
  mode: "solo"
  retries: 5
  token_warning: 70
  token_critical: 90
  loop_warning: 3
  loop_interrupt: 5
  activity_timeout: "30s"
  error_threshold: 0.5
  worktree_mode: "multi_agent"
  auto_save_model: true
  max_tool_repeat_total: 0
  # Maximum number of CONSECUTIVE identical tool calls (same tool + same args)
  # before a hard loop guard fires. The repeat horizon is STATE-AWARE: a
  # successful state-changing call (edit/write/bash/python/terminal) resets
  # the consecutive counter, so edit -> test(fail) -> edit cycles never trip
  # this guard. Only identical repeats with NO intervening change count.
  max_tool_repeat_consecutive: 2
  # Maximum number of duplicate occurrences of the SAME tool call within the
  # rolling window below. Different tool calls do NOT count toward this limit.
  # The window only spans the current "state epoch": a successful edit/write/
  # shell call resets it, so legitimate re-runs after a change are not flagged.
  max_tool_calls: 3
  # Maximum number of CONSECUTIVE failing calls of the SAME tool (any args)
  # tolerated before a loop guard fires once, telling the model to stop and
  # change approach. This catches a model retrying one tool with ever-changing
  # inputs that all fail (e.g. an interpreter missing a feature) — a pattern
  # exact tool+args matching cannot see. Resets on any success or tool switch.
  max_tool_error_streak: 4
  # Number of recent tool calls inspected for the duplicate-window limit above.
  # A call outside this window is no longer counted as a duplicate.
  tool_call_limit_reset_window: 10
  # Maximum number of consecutive LLM rounds that end with tool calls and
  # no visible text or thinking before a forced-answer nudge is injected.
  # Thinking-heavy models (DeepSeek, Qwen, Claude with extended thinking)
  # may need a higher value or 0 (disabled) to avoid mid-task interruption.
  # 0 = disabled, default: 15.
  max_consecutive_tool_rounds: 15
  # Local models (LM Studio, Ollama, etc.) sometimes emit tool calls as XML
  # markup inside content or reasoning streams instead of native tool_calls.
  # Auto-heal extracts and executes these malformed calls so the turn keeps
  # progressing.
  auto_heal_tool_calls: true

providers: []

models: []

context_compression:
  enabled: true
  # 0 means "auto": use the active model's advertised context window.
  max_tokens: 0
  # Fill levels (percent of the effective window) at which PROACTIVE
  # compression escalates. Every layer is OPT-IN (0 = disabled): proactive
  # threshold compression busts the provider prefix cache and re-bills most
  # of the context for modest headroom, so it is OFF by default. Enable a
  # layer by setting a positive percent.
  #   soft: early cheap maintenance; trigger: the configured strategy fires;
  #   hard: proactive emergency ceiling (gate bypass + hard-layer strategy).
  # The legacy "threshold_percent" key still works and, when set, overrides
  # thresholds.trigger_percent (backwards compatibility).
  thresholds:
    soft_percent: 0
    trigger_percent: 0
    hard_percent: 0
  # Optional per-model overrides keyed by models[].id, e.g.:
  # per_model:
  #   "local-qwen3-8b":
  #     max_tokens: 24576
  #     strategy: "hybrid"
  #     thresholds: { soft_percent: 40, trigger_percent: 65, hard_percent: 90 }
  # Reactive safety net (always on): on a context-length error the hybrid
  # strategy runs — tool_elision → selective → summarize (last resort) — and
  # the hard-ceiling enforcer drops oldest messages to keep the request valid.
  on_context_error: true
  strategy: "micro"
  preserve_recent_turns: 4
  micro_compaction:
    # OPT-IN (default: off). Micro compaction is a pre-summarize step on a full
    # window. When OFF, summarize is always the default compaction path. When
    # ON, micro first runs as a DRY-RUN (estimation only, never mutates) to
    # validate it can meet the required shrink; summarize still runs on the
    # ORIGINAL history (preserving the provider prefix cache), and micro is
    # only applied for real if that summarize fails with a context-overflow
    # error (to create enough room to compress).
    enabled: false
    keep_recent_messages: 20
    min_content_tokens: 100
    cache_miss_threshold: "1h"
    truncated_marker: "[Old tool result content cleared]"
    min_context_ratio: 0.5

telegram:
  enabled: true

orchestrator:
  roles: {}
  pool:
    max_total_agents: 8
    max_agents_per_model: {}
  defaults:
    topology: "hub"
    run_timeout: "10m"
  retention:
    enabled: true
    days: 7

goals:
  retention:
    enabled: true
    days: 7
  done_gate: verify
  verify_commands: true
  max_verify_failures: 3
  stall_turns: 5
  default_turn_budget: 50
  judge: off
  # When a model-blocked goal provides a justification (reason + expectation),
  # auto-spawn an "unblocking" investigation goal in front of it to search for
  # solutions before asking the user for guidance. Default on.
  auto_unblock: true

plan:
  retention:
    enabled: true
    days: 7

multi_agent:
  enabled: false
  pattern: "pair"
  max_companion_cycles: 2
  companion_provider: ""
  companion_model: ""
  planner_model: ""
  coder_model: ""
  message_timeout: "120s"
  show_inter_agent_messages: true

memory:
  enabled: true
  dir: ".goa/memory"
  auto_summarize: true
  dream:
    enabled: false
    auto: false
    interval: "7d"
    min_sessions: 5
    model: ""
    provider: ""
    max_tokens: 8192
    temperature: 0.2
    output_dir: ".goa/memory.dream"
    consolidated_dir: ".goa/memory.consolidated"
    apply_after_review: false

skills:
  dirs:
    - ".goa/skills"
  embedded: true

tools:
  bash:
    blocked_commands:
      - "rm -rf /"
      - "rm -rf ~"
      - "sudo rm"
      - ":(){ :|:& };:"  # fork bomb
      - "mkfs"
      - "dd if=/dev/zero"
    allowed_commands: []
    env_mask_patterns:
      - "*KEY*"
      - "*TOKEN*"
      - "*SECRET*"
      - "*PASSWORD*"
    compress_output:  # null = auto-detect based on provider (local=on, remote=off)
    jail: false
  ssh:
    hosts: []
  python:
    timeout_seconds: 60
  edit:
    allow_fuzz_on_edits: true
    fuzzy_match: true
  write:
    # Note: write does NOT support fuzzy filename matching — writing to the
    # wrong path would cause irreversible data loss.
  read_file:
    fuzzy_match: true
    # Re-reading byte-identical content returns a short hint instead of the
    # full body, so an append-only context is not bloated with redundant
    # file copies (ENHANCE.md E1.3). A changed file or a different line
    # range is never deduped. Set false to always return full content.
    dedup: true
  webfetch:
    enabled: true
    max_lines_default: 250
    max_lines_hard: 4096
    max_total_bytes: 20971520
    timeout_seconds: 30
    user_agent: "Goa/1.0 (+https://github.com/pijalu/goa)"
    max_redirects: 5
    allowed_schemes:
      - "https"
      - "http"
    blocked_hosts: []
    cache:
      enabled: true
      dir: ""
      ttl_hours: 24
      max_entries: 1000
      max_bytes: 524288000
      cleanup_interval_hours: 24
    summary:
      enabled: false
      sub_agent_role: "companion"
      max_input_lines: 1000
      default_prompt: |
        Summarize the following web page in 3-5 concise paragraphs. Preserve key facts, names, numbers, and any URLs that are central to the content.
  enabled:
    bg_exec: true
    delegate_to: true
    memento: false
    pty_exec: false
    request_review: true
    ssh_bash: false
    webfetch: true
    verify: true
    python: true
    agent: true
    agent_swarm: true
    goa: true
    lsp: true
    todo_list: true
  search:
    threads: 4
    max_results: 30
    exclude:
      - ".git"
      - "vendor"
      - "node_modules"
      - "dist"
      - ".next"
      - "build"

tui:
  theme: "dark"
  layout: "default"
  show_timestamps: false
  modeline:
    left:
      - "app-badge"
      - "mode-badge"
      - "current-file"
    right:
      - "token-bar"
      - "activity"
      - "help-hint"
  transparency:
    show_thinking: true
    show_streaming: true
    show_tool_calls: true
    show_token_stats: true
    show_logs: false
    thinking_pane_position: "side"
    highlight_tool_input: true
    thinking_collapsed: false
  # tools controls how tool calls are rendered in the chat.
  #   view: "summary" (N-line preview, default) | "full" (everything)
  #   preview_lines: lines shown per tool block in summary mode (default 10).
  # Ctrl+O toggles all tool blocks between summary and full at runtime.
  tools:
    view: "summary"
    preview_lines: 10
  # history controls per-session input history loading and search.
  # max_loaded: max entries loaded from session files (0 = disabled, default 100).
  history:
    max_loaded: 100

plugins:
  dirs:
    - ".goa/plugins"
    - "$HOME/.goa/plugins"
  enabled: ["*"]

completion:
  min_usage_threshold: 10
  max_most_used: 3

prompts:
  dir: ".goa/prompts"

logging:
  level: "info"
  file: ""